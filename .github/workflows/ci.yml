name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      # 固定包管理器并使用锁文件，避免 CI 与本地安装不同的依赖树。
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  node20-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      # pnpm 11 需要 Node >=22.13；安装后切回 Demo 的最低运行版本验证各步骤。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.0"
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  published-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      # SDK 只作为隔离契约输入，不成为 Demo 的运行依赖或提高其 Node 下限。
      - run: npm install --prefix "$RUNNER_TEMP/published-sdk" --ignore-scripts --no-audit --no-fund @unifyport/sdk-node@0.5.0
      - run: node --import tsx tests/published-contract-consumer.ts "$RUNNER_TEMP/published-sdk/node_modules/@unifyport/sdk-node/dist/index.js"
